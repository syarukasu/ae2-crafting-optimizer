modLoader = "javafml"
loaderVersion = "[4,)"
license = "LGPL-3.0-only"
issueTrackerURL = "https://github.com/syarukasu/ae2-crafting-optimizer/issues"

[[mods]]
modId = "ae2_crafting_optimizer"
version = "${file.jarVersion}"
displayName = "AE2 Crafting Optimizer"
authors = "syaru"
displayURL = "https://github.com/syarukasu/ae2-crafting-optimizer"
logoFile = "logo.png"
description = '''
Alpha snapshot: VM-based crafting planning with BigInteger quantities and exact API integration.
No ACO throughput cap on ordinary AE2 dispatch. AE2 and add-ons own physical execution.
Industrial performance and full wide-job lifecycle acceptance remain pending.
'''

[[dependencies.ae2_crafting_optimizer]]
modId = "ae2vm_aco"
type = "required"
versionRange = "[0.3.12-vm-refs.8-neoforge,0.4.0)"
ordering = "AFTER"
side = "BOTH"

