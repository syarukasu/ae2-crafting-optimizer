plugins {
    id 'net.minecraftforge.gradle' version '6.0.54'
}

group = mod_group
version = mod_version

base {
    archivesName = "aco${mod_version}_${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: 'official', version: '1.20.1'

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'
            mods {
                ae2_crafting_optimizer {
                    source sourceSets.main
                }
            }
        }
        server {
            workingDirectory project.file('run-server')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'
            args '--nogui'
            mods {
                ae2_crafting_optimizer {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'ModMaven'
        url = 'https://modmaven.dev/'
        content {
            includeGroup 'appeng'
        }
    }
    maven {
        name = 'ExpandiumReleases'
        url = 'https://repo.expandium.net/releases'
        content {
            includeGroup 'appeng'
        }
    }
    maven {
        name = 'GTCEu'
        url = 'https://maven.gtceu.com/'
        content {
            includeGroup 'com.gregtechceu.gtceu'
        }
    }
    maven {
        name = 'FirstDarkDev'
        url = 'https://maven.firstdark.dev/snapshots'
        content {
            includeGroup 'com.lowdragmc.ldlib'
        }
    }
    maven {
        name = 'CurseMaven'
        url = 'https://www.cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.18'

    def ae2Variant = (findProperty('ae2Variant') ?: 'upstream').toString().toLowerCase()
    if (!(ae2Variant in ['upstream', 'uelm'])) {
        throw new GradleException("ae2Variant must be 'upstream' or 'uelm', got ${ae2Variant}")
    }
    def ae2Version = ae2Variant == 'uelm' ? '15.5.0-uelm' : '15.4.10'
    def localModsDir = file(findProperty('acoLocalModsDir') ?: '../../mods')
    def localAe2 = new File(localModsDir, "appliedenergistics2-forge-${ae2Version}.jar")
    def localGtceu = new File(localModsDir, 'gtceu-1.20.1-7.5.3.jar')
    def localLdlib = new File(localModsDir, 'ldlib-forge-1.20.1-1.0.50.jar')
    def localAdvancedAe = new File(localModsDir, 'AdvancedAE-1.3.5-1.20.1.jar')

    if (localAe2.isFile() && localGtceu.isFile() && localLdlib.isFile()
            && localAdvancedAe.isFile()) {
        // A checked-out pack can build reproducibly even when an optional mod Maven is unavailable.
        implementation files(localAe2)
        compileOnly files(localGtceu)
        compileOnly files(localLdlib)
        compileOnly files(localAdvancedAe)
    } else {
        implementation fg.deobf("appeng:appliedenergistics2-forge:${ae2Version}")
        def gtceuDependency = project.dependencies.create('com.gregtechceu.gtceu:gtceu-1.20.1:7.5.3') {
            transitive = false
        }
        def ldlibDependency = project.dependencies.create('com.lowdragmc.ldlib:ldlib-forge-1.20.1:1.0.40.b') {
            transitive = false
        }
        def advancedAeDependency = project.dependencies.create('curse.maven:advancedae-1084104:7939754') {
            transitive = false
        }

        compileOnly fg.deobf(gtceuDependency)
        compileOnly fg.deobf(ldlibDependency)
        compileOnly fg.deobf(advancedAeDependency)
    }
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    testImplementation platform('org.junit:junit-bom:5.10.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.register('verifyMixinPackageBoundary') {
    doLast {
        def sourceRoot = file('src/main/java')
        def forbiddenReference = ~/com\.syaru\.ae2craftingoptimizer\.mixin\.[A-Za-z0-9_.$]+/
        def violations = []

        fileTree(sourceRoot).matching { include '**/*.java' }.files.each { sourceFile ->
            def relativePath = sourceRoot.toPath().relativize(sourceFile.toPath()).toString()
            if (relativePath.replace('\\', '/').startsWith('com/syaru/ae2craftingoptimizer/mixin/')) {
                return
            }
            sourceFile.eachLine { line, lineNumber ->
                if (line =~ forbiddenReference) {
                    violations << "${relativePath}:${lineNumber}: ${line.trim()}"
                }
            }
        }

        if (!violations.isEmpty()) {
            throw new GradleException(
                    'Production code must not directly reference classes in the Mixin package:\n'
                            + violations.join('\n'))
        }
    }
}

tasks.named('compileJava') {
    dependsOn 'verifyMixinPackageBoundary'
}

test {
    useJUnitPlatform()
    // 指定された公開Neo ECO JARを、JUnitのバイトコード契約検査へ明示的に渡す。
    ['neoEco20_3Jar', 'neoEco20_4Jar'].each { propertyName ->
        if (project.hasProperty(propertyName)) {
            systemProperty "aco.${propertyName}", file(project.property(propertyName)).absolutePath
        }
    }
}

tasks.register('verifyIssueRegressionManifest') {
    description = 'Validate the machine-readable mapping from historical Issues to regression evidence.'
    group = 'verification'
    dependsOn tasks.named('test')
}

tasks.register('verifyIssueRegressionReleaseReadiness') {
    description = 'Validate the automated regression scope for the current patch release.'
    group = 'verification'
    dependsOn tasks.named('verifyIssueRegressionManifest')

    def manifestFile = layout.projectDirectory.file('docs/issues/REGRESSION_MATRIX.tsv')
    def releaseScopeFile = layout.projectDirectory.file("docs/issues/RELEASE_SCOPE_${project.version}.tsv")
    inputs.file(manifestFile)
    inputs.file(releaseScopeFile)

    doLast {
        List<String> manifestLines = manifestFile.asFile.readLines('UTF-8').findAll { line ->
            !line.isBlank() && !line.startsWith('#')
        }
        Map<String, String[]> manifestByIssue = [:]

        // リリース対象Issueを正本の回帰台帳へ結び付けるため、Issue番号で索引化します。
        for (String line : manifestLines.drop(1)) {
            String[] columns = line.split('\t', -1)
            if (columns.length != 8) {
                throw new GradleException("Malformed regression matrix row: ${line}")
            }
            manifestByIssue[columns[0]] = columns
        }

        List<String> scopeLines = releaseScopeFile.asFile.readLines('UTF-8')
        String expectedVersion = "# release=${project.version}"
        String baselineLine = scopeLines.find { line -> line.startsWith('# baseline=') }
        if (!scopeLines.contains(expectedVersion)) {
            throw new GradleException("Release scope does not match project version ${project.version}")
        }
        if (baselineLine == null || baselineLine.substring('# baseline='.length()).isBlank()) {
            throw new GradleException('Release scope must declare a non-empty baseline version')
        }

        List<String> scopeData = scopeLines.findAll { line -> !line.isBlank() && !line.startsWith('#') }
        if (scopeData.isEmpty() || scopeData.first() != 'issue\tchange\tautomated_guarantee') {
            throw new GradleException('Release scope header is missing or malformed')
        }

        List<String> pendingRuntime = []
        Set<String> scopedIssues = [] as Set

        // 今回の差分へ関係するIssueだけを検証し、過去全件監査とは責務を分離します。
        for (String line : scopeData.drop(1)) {
            String[] columns = line.split('\t', -1)
            if (columns.length != 3) {
                throw new GradleException("Malformed release scope row: ${line}")
            }
            if (!scopedIssues.add(columns[0])) {
                throw new GradleException("Duplicate release scope Issue: #${columns[0]}")
            }
            String[] manifest = manifestByIssue[columns[0]]
            if (manifest == null) {
                throw new GradleException("Release scope references unknown Issue: #${columns[0]}")
            }
            if (columns[1].isBlank() || columns[2].isBlank()) {
                throw new GradleException("Release scope explanation is empty: #${columns[0]}")
            }
            if (manifest[5] == 'PENDING') {
                pendingRuntime.add("#${columns[0]} [${manifest[3]}] ${manifest[7]}")
            }
        }

        if (scopedIssues.isEmpty()) {
            throw new GradleException('Release scope must contain at least one Issue')
        }

        // 未実施の実機確認は成功へ変換せず、公開時に明示する警告として残します。
        if (!pendingRuntime.isEmpty()) {
            logger.warn('Patch release automated gate passed, but runtime verification remains pending:\n- '
                    + pendingRuntime.join('\n- '))
        }
    }
}

tasks.register('verifyAllIssueRuntimeReadiness') {
    description = 'Require every historical GameTest and runtime regression check to be verified.'
    group = 'verification'
    dependsOn tasks.named('verifyIssueRegressionManifest')

    def manifestFile = layout.projectDirectory.file('docs/issues/REGRESSION_MATRIX.tsv')
    inputs.file(manifestFile)

    doLast {
        List<String> dataLines = manifestFile.asFile.readLines('UTF-8').findAll { line ->
            !line.isBlank() && !line.startsWith('#')
        }
        List<String> blockers = []

        // 全履歴保証では、未実施のGameTestと実機試験を一件も許可しません。
        for (String line : dataLines.drop(1)) {
            String[] columns = line.split('\t', -1)
            if (columns.length != 8) {
                throw new GradleException("Malformed regression matrix row: ${line}")
            }
            if (columns[5] != 'PENDING') {
                continue
            }
            blockers.add("#${columns[0]} [${columns[3]}] ${columns[7]}")
        }

        // 全履歴を確認済みと名乗る場合だけ、残る未確認項目を厳格に拒否します。
        if (!blockers.isEmpty()) {
            throw new GradleException(
                    'Full historical runtime gate is blocked by pending verification:\n- '
                            + blockers.join('\n- '))
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyIssueRegressionManifest')
}

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') {
        expand 'file': ['jarVersion': project.version]
    }
}

jar {
    // 配布JAR内のMinecraft参照を、本番環境で使われる難読化名へ必ず変換する。
    finalizedBy 'reobfJar'
    manifest {
        attributes([
            'Specification-Title': mod_id,
            'Specification-Vendor': 'syaru',
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': project.version,
            'Implementation-Vendor': 'syaru',
            'MixinConfigs': 'ae2_crafting_optimizer.mixins.json'
        ])
    }
}

tasks.register('normalizeReobfJarName') {
    dependsOn 'reobfJar'
    doLast {
        def expected = file("$buildDir/libs/aco${mod_version}_${minecraft_version}.jar")
        def sources = fileTree("$buildDir/libs").matching {
            include "aco${mod_version}_${minecraft_version}-*.jar"
        }.files
        def source = sources.find { it.name != expected.name }
        if (source != null && source.exists()) {
            try {
                java.nio.file.Files.move(
                        source.toPath(),
                        expected.toPath(),
                        java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            } catch (java.io.IOException exception) {
                throw new GradleException(
                        "Could not normalize ${source.name} to ${expected.name}",
                        exception)
            }
        }
        if (!expected.isFile()) {
            throw new GradleException("Expected distribution JAR was not produced: ${expected}")
        }
    }
}

tasks.named('build') {
    finalizedBy 'normalizeReobfJarName'
}
