plugins {
    id 'net.minecraftforge.gradle' version '6.0.54'
}

group = mod_group
version = mod_version

// Issue #208: isolated fork library only; never run the upstream mod build.
def exactVmProjectDir = file(findProperty('acoExactVmDir')
        ?: '../vm/exact-engine')
def exactVmVersion = '0.1.6'
def nativeVmProjectDir = new File(exactVmProjectDir.parentFile, 'native-engine')
def nativeVmVersion = '0.3.13-profiler.1'
def exactVmJar = new File(exactVmProjectDir, "build/libs/aco-exact-vm-${exactVmVersion}.jar")
def exactVmSourcesJar = new File(exactVmProjectDir, "build/libs/aco-exact-vm-${exactVmVersion}-sources.jar")
tasks.register('buildExactVm', GradleBuild) {
    dir = exactVmProjectDir
    tasks = ['jar', 'sourcesJar']
}

base {
    archivesName = "aco${mod_version}_${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}


sourceSets {
    vmNative {
        java.srcDir new File(nativeVmProjectDir, 'src/main/java')
        java.srcDir new File(exactVmProjectDir.parentFile, 'src/main/java')
        java.include 'com/ae2vm/addon/nativeengine/**'
        java.include 'com/ae2vm/addon/vm/CraftingBytecode.java', 'com/ae2vm/addon/vm/Opcode.java',
                'com/ae2vm/addon/compiler/PatternCompiler.java', 'com/ae2vm/addon/compiler/IFiniteUseInput.java',
                'com/ae2vm/addon/vm/CraftingVM.java', 'com/ae2vm/addon/vm/Vm*.java'
        java.exclude '**/NativeGraphCalculation.java', '**/NativeOrderSnapshot.java', '**/NativePlanSelections.java',
                '**/NativeCraftingRecipeMixin.java'
        resources.srcDir new File(nativeVmProjectDir, 'src/main/resources')
        compileClasspath = configurations.compileClasspath
        runtimeClasspath += configurations.runtimeClasspath
    }
}
sourceSets.main.compileClasspath += sourceSets.vmNative.output
sourceSets.main.runtimeClasspath += sourceSets.vmNative.output
minecraft {
    mappings channel: 'official', version: '1.20.1'

    runs {
        client {
            workingDirectory project.file('run')
            args '--mixin', 'ae2_crafting_optimizer.mixins.json'
            args '--mixin', 'ae2vm-aco-native.mixins.json'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', project.file('build/createSrgToMcp/output.srg').absolutePath
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'
            mods {
                ae2_crafting_optimizer {
                    source sourceSets.main
                }
                ae2vm_aco { source sourceSets.vmNative }
            }
        }
        server {
            workingDirectory project.file('run-server')
            args '--mixin', 'ae2_crafting_optimizer.mixins.json'
            args '--mixin', 'ae2vm-aco-native.mixins.json'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', project.file('build/createSrgToMcp/output.srg').absolutePath
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'
            args '--nogui'
            mods {
                ae2_crafting_optimizer {
                    source sourceSets.main
                }
                ae2vm_aco { source sourceSets.vmNative }
            }
        }
    }
}

repositories {
    mavenCentral()
    flatDir {
        name = 'acoExactVmFork'
        dirs new File(exactVmProjectDir, 'build/libs')
        dirs new File(nativeVmProjectDir, 'build/libs')
        content { includeGroup 'com.syaru.ae2vm' }
    }
    maven {
        name = 'ModMaven'
        url = 'https://modmaven.dev/'
        content {
            includeGroup 'appeng'
        }
    }
    maven {
        name = 'ExpandiumReleases'
        url = 'https://repo.expandium.net/releases'
        content {
            includeGroup 'appeng'
        }
    }
    maven {
        name = 'GTCEu'
        url = 'https://maven.gtceu.com/'
        content {
            includeGroup 'com.gregtechceu.gtceu'
        }
    }
    maven {
        name = 'FirstDarkDev'
        url = 'https://maven.firstdark.dev/snapshots'
        content {
            includeGroup 'com.lowdragmc.ldlib'
        }
    }
    maven {
        name = 'CurseMaven'
        url = 'https://www.cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.18'
    implementation files(exactVmJar).builtBy(tasks.named('buildExactVm'))
    def ae2Variant = (findProperty('ae2Variant') ?: 'upstream').toString().toLowerCase()
    if (!(ae2Variant in ['upstream', 'uelm'])) {
        throw new GradleException("ae2Variant must be 'upstream' or 'uelm', got ${ae2Variant}")
    }
    def upstreamAe2Version = (findProperty('acoAe2Version') ?: '15.4.10').toString()
    if (new org.apache.maven.artifact.versioning.DefaultArtifactVersion(upstreamAe2Version)
            .compareTo(new org.apache.maven.artifact.versioning.DefaultArtifactVersion('15.4.10')) < 0) {
        throw new GradleException("AE2 build profile must be at least 15.4.10: " + upstreamAe2Version)
    }
    def ae2Version = ae2Variant == 'uelm' ? '15.5.0-uelm' : upstreamAe2Version
    def localModsDir = file(findProperty('acoLocalModsDir') ?: '../../mods')
    def localAe2 = new File(localModsDir, "appliedenergistics2-forge-${ae2Version}.jar")
    def localGtceu = new File(localModsDir, 'gtceu-1.20.1-7.5.3.jar')
    def localLdlib = new File(localModsDir, 'ldlib-forge-1.20.1-1.0.50.jar')
    def localAdvancedAe = new File(localModsDir, 'AdvancedAE-1.3.5-1.20.1.jar')

    if (localAe2.isFile() && localGtceu.isFile() && localLdlib.isFile()
            && localAdvancedAe.isFile()) {
        // A checked-out pack can build reproducibly even when an optional mod Maven is unavailable.
        repositories.flatDir {
            name = 'acoLocalMods'
            dirs localModsDir
            content { includeGroup 'aco.local' }
        }
        // Issue #182: distribution JARs use SRG names, not the names in the test runtime.
        implementation fg.deobf("aco.local:appliedenergistics2-forge:${ae2Version}")
        compileOnly fg.deobf('aco.local:gtceu-1.20.1:7.5.3')
        compileOnly fg.deobf('aco.local:ldlib-forge-1.20.1:1.0.50')
        compileOnly fg.deobf('aco.local:AdvancedAE:1.3.5-1.20.1')
    } else {
        implementation fg.deobf("appeng:appliedenergistics2-forge:${ae2Version}")
        def gtceuDependency = project.dependencies.create('com.gregtechceu.gtceu:gtceu-1.20.1:7.5.3') {
            transitive = false
        }
        def ldlibDependency = project.dependencies.create('com.lowdragmc.ldlib:ldlib-forge-1.20.1:1.0.40.b') {
            transitive = false
        }
        def advancedAeDependency = project.dependencies.create('curse.maven:advancedae-1084104:7939754') {
            transitive = false
        }

        compileOnly fg.deobf(gtceuDependency)
        compileOnly fg.deobf(ldlibDependency)
        compileOnly fg.deobf(advancedAeDependency)
    }
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    def mekanismJar = file(findProperty('acoMekanismJar') ?: '../../deps/Mekanism-1.20.1-10.4.16.80.jar')
    def mekanismDependency
    if (mekanismJar.isFile()) {
        repositories.flatDir {
            name = 'acoMekanism'
            dirs mekanismJar.parentFile
            content { includeGroup 'aco.mekanism' }
        }
        mekanismDependency = 'aco.mekanism:Mekanism-1.20.1:10.4.16.80'
    } else {
        repositories.maven { url = 'https://modmaven.dev/' }
        mekanismDependency = 'mekanism:Mekanism:1.20.1-10.4.16.80'
    }
    compileOnly fg.deobf(mekanismDependency)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.register('verifyMixinPackageBoundary') {
    doLast {
        def sourceRoot = file('src/main/java')
        def forbiddenReference = ~/com\.syaru\.ae2craftingoptimizer\.mixin\.[A-Za-z0-9_.$]+/
        def violations = []

        fileTree(sourceRoot).matching { include '**/*.java' }.files.each { sourceFile ->
            def relativePath = sourceRoot.toPath().relativize(sourceFile.toPath()).toString()
            if (relativePath.replace('\\', '/').startsWith('com/syaru/ae2craftingoptimizer/mixin/')) {
                return
            }
            sourceFile.eachLine { line, lineNumber ->
                if (line =~ forbiddenReference) {
                    violations << "${relativePath}:${lineNumber}: ${line.trim()}"
                }
            }
        }

        if (!violations.isEmpty()) {
            throw new GradleException(
                    'Production code must not directly reference classes in the Mixin package:\n'
                            + violations.join('\n'))
        }
    }
}

tasks.named('compileJava') {
    dependsOn 'verifyMixinPackageBoundary', 'buildExactVm'
}
tasks.named('compileVmNativeJava') { dependsOn 'buildExactVm' }
tasks.named('processVmNativeResources') {
    inputs.property 'ae2AdmissionRange', '[15.4.10,)'
    // Issue #225: the bundled VM must not reintroduce an AE2 version ceiling.
    filesMatching('META-INF/mods.toml') {
        filter { line -> line.replace('versionRange="[15.4.10,16)"', 'versionRange="[15.4.10,)"') }
    }
}

tasks.register('vmNativeJar', Jar) {
    from sourceSets.vmNative.output
    from(exactVmProjectDir.parentFile) {
        include 'LICENSE'
        into 'META-INF'
    }
    archiveFileName = "aco-vm-native-${nativeVmVersion}.jar"
    destinationDirectory = new File(nativeVmProjectDir, 'build/libs')
    manifest { attributes 'MixinConfigs': 'ae2vm-aco-native.mixins.json' }
}
tasks.register('vmNativeSourcesJar', Jar) {
    from(sourceSets.vmNative.allSource) { exclude 'META-INF/mods.toml' }
    from(tasks.named('processVmNativeResources')) { include 'META-INF/mods.toml' }
    from(exactVmProjectDir.parentFile) { include 'LICENSE'; into 'META-INF' }
    from(nativeVmProjectDir) { include 'README.md' }
    archiveFileName = "aco-vm-native-${nativeVmVersion}-sources.jar"
    destinationDirectory = layout.buildDirectory.dir('vm-sources')
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
reobf {
    vmNativeJar { }
}

tasks.register('vmBundleSources', Copy) {
    dependsOn 'buildExactVm', 'vmNativeSourcesJar'
    from exactVmSourcesJar
    from(tasks.named('vmNativeSourcesJar').flatMap { it.archiveFile })
    into layout.buildDirectory.dir("distributions/${mod_version}/sources")
}

tasks.register('vmBundleMetadata') {
    def target = layout.buildDirectory.file('vm-metadata/META-INF/jarjar/metadata.json')
    outputs.file target
    inputs.property 'exactVersion', exactVmVersion
    inputs.property 'nativeVersion', nativeVmVersion
    doLast {
        def artifacts = [
                ['aco-exact-vm', exactVmVersion, '0.2.0'],
                ['aco-vm-native', nativeVmVersion, '0.4.0']]
        def metadata = [jars: artifacts.collect { artifact, selected, upper ->
            [identifier: [group: 'com.syaru.ae2vm', artifact: artifact],
             version: [range: "[${selected},${upper})", artifactVersion: selected],
             path: "META-INF/jarjar/${artifact}-${selected}.jar", isObfuscated: false]
        }]
        target.get().asFile.parentFile.mkdirs()
        target.get().asFile.setText(groovy.json.JsonOutput.prettyPrint(
                groovy.json.JsonOutput.toJson(metadata)), 'UTF-8')
    }
}

// Both nested artifacts are built before packaging; no pre-existing flatDir JAR is required.
tasks.register('bundleVm', Jar) {
    dependsOn 'reobfJar', 'reobfVmNativeJar', 'buildExactVm', 'vmBundleMetadata'
    from({ zipTree(tasks.named('jar').get().archiveFile.get().asFile) }) {
        exclude 'META-INF/MANIFEST.MF'
    }
    from(exactVmJar) { into 'META-INF/jarjar' }
    from(tasks.named('vmNativeJar').flatMap { it.archiveFile }) { into 'META-INF/jarjar' }
    from(layout.buildDirectory.dir('vm-metadata'))
    manifest.from(tasks.named('jar').get().manifest)
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    destinationDirectory = layout.buildDirectory.dir("distributions/${mod_version}")
    archiveFileName = "aco${mod_version}_${minecraft_version}.jar"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') {
        expand 'file': ['jarVersion': project.version]
    }
}

jar {
    destinationDirectory = layout.buildDirectory.dir('intermediates/jars')
    archiveClassifier = 'NOT-FOR-INSTALLATION'
    // 配布JAR内のMinecraft参照を、本番環境で使われる難読化名へ必ず変換する。
    finalizedBy 'reobfJar'
    manifest {
        attributes([
            'Specification-Title': mod_id,
            'Specification-Vendor': 'syaru',
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': project.version,
            'Implementation-Vendor': 'syaru',
            'MixinConfigs': 'ae2_crafting_optimizer.mixins.json'
        ])
    }
}

tasks.named('build') {
    dependsOn 'bundleVm', 'vmNativeSourcesJar'
    finalizedBy 'verifyExactVmBundle'
}

tasks.register('verifyExactVmBundle') {

    dependsOn 'bundleVm', 'vmBundleSources'
    doLast {
        // #218: comparison code must not leak back through a transitive runtime dependency.
        if (configurations.runtimeClasspath.files.any {
            it.name.startsWith('smtinterpol-') || it.name.endsWith('-graph-fixtures.jar')
        }) throw new GradleException('Test-only graph solver leaked into the runtime classpath')
        def distribution = tasks.named('bundleVm').get().archiveFile.get().asFile
        if (distribution.parentFile.listFiles().findAll { it.name.endsWith('.jar') }.size() != 1)
            throw new GradleException('Distribution directory must contain only the installable VM bundle')
        def expectedSources = [exactVmSourcesJar, tasks.named('vmNativeSourcesJar').get().archiveFile.get().asFile]
        def sourcesDir = new File(distribution.parentFile, 'sources')
        if ((sourcesDir.listFiles()*.name as Set) != (expectedSources*.name as Set)
                || expectedSources.any { !java.util.Arrays.equals(it.bytes, new File(sourcesDir, it.name).bytes) })
            throw new GradleException('Only matching runtime VM sources may accompany the distribution')
        new java.util.zip.ZipFile(distribution).withCloseable { outer ->
            def metadataEntry = outer.getEntry('META-INF/jarjar/metadata.json')
            if (metadataEntry == null) throw new GradleException('Missing Jar-in-Jar metadata')
            def metadata = outer.getInputStream(metadataEntry).withCloseable {
                new groovy.json.JsonSlurper().parse(it)
            }
            def nestedPaths = outer.entries().findAll { it.name.endsWith('.jar') }.collect { it.name } as Set
            if (metadata.jars.size() != 2
                    || nestedPaths != (metadata.jars.collect { it.path } as Set)
                    || outer.getEntry('META-INF/NOTICE-SMTINTERPOL.txt') != null)
                throw new GradleException('Only the runtime exact and native VM libraries may be bundled')
            def entries = metadata.jars.findAll {
                it.identifier.group == 'com.syaru.ae2vm' && it.identifier.artifact == 'aco-exact-vm'
            }
            if (entries.size() != 1 || entries[0].version.artifactVersion != exactVmVersion)
                throw new GradleException('Exact VM library version is missing or ambiguous')
            def libraryEntry = outer.getEntry(entries[0].path)
            if (libraryEntry == null) throw new GradleException('Embedded exact VM library is missing')
            byte[] library = outer.getInputStream(libraryEntry).withCloseable { it.readAllBytes() }
            if (!java.util.Arrays.equals(library, exactVmJar.bytes))
                throw new GradleException('Embedded VM differs from the tested local library')
            new java.util.jar.JarInputStream(new ByteArrayInputStream(library)).withCloseable { inner ->
                def attributes = inner.manifest?.mainAttributes
                if (attributes?.getValue('FMLModType') != 'GAMELIBRARY'
                        || attributes.getValue('MixinConfigs') != null)
                    throw new GradleException('VM must be a library without a second mod interception')
                def names = [] as Set
                for (def entry = inner.nextJarEntry; entry != null; entry = inner.nextJarEntry) names.add(entry.name)
                if (!names.containsAll(['com/syaru/ae2vm/exact/ExactCraftingVM.class',
                        'com/syaru/ae2vm/exact/ExactBranchBytecode.class',
                        'com/syaru/ae2vm/exact/ExactBytecode.class', 'META-INF/LICENSE-AE2-VM', 'META-INF/NOTICE.txt'])
                        || names.any { it == 'META-INF/mods.toml' || it.endsWith('.mixins.json')
                            || it.startsWith('com/ae2vm/addon/') || it.contains('ExactBranchVM')
                            || it.startsWith('com/syaru/ae2vm/exact/graph/')
                            || it.startsWith('de/uni_freiburg/informatik/ultimate/') })
                    throw new GradleException('VM library content/license boundary violated')
            }
            def nativeEntries = metadata.jars.findAll {
                it.identifier.group == 'com.syaru.ae2vm' && it.identifier.artifact == 'aco-vm-native'
            }
            if (nativeEntries.size() != 1 || nativeEntries[0].version.artifactVersion != nativeVmVersion)
                throw new GradleException('Native VM mod is missing or ambiguous')
            def nativeEntry = outer.getEntry(nativeEntries[0].path)
            if (nativeEntry == null) throw new GradleException('Native VM JAR is missing')
            byte[] nativeBytes = outer.getInputStream(nativeEntry).withCloseable { it.readAllBytes() }
            if (!java.util.Arrays.equals(nativeBytes, tasks.named('vmNativeJar').get().archiveFile.get().asFile.bytes))
                throw new GradleException('Native VM differs from the reobfuscated local artifact')
            new java.util.jar.JarInputStream(new ByteArrayInputStream(nativeBytes)).withCloseable { inner ->
                if (inner.manifest?.mainAttributes?.getValue('MixinConfigs') != 'ae2vm-aco-native.mixins.json')
                    throw new GradleException('Native VM bootstrap is not declared')
                def names = [] as Set
                for (def entry = inner.nextJarEntry; entry != null; entry = inner.nextJarEntry) {
                    names.add(entry.name)
                    if (entry.name == 'META-INF/mods.toml'
                            && !new String(inner.readAllBytes(), java.nio.charset.StandardCharsets.UTF_8)
                                .contains('versionRange="[15.4.10,)"'))
                        throw new GradleException('Native VM must use minimum-only AE2 admission')
                }
                if (!names.containsAll(['META-INF/mods.toml', 'META-INF/LICENSE',
                        'ae2vm-aco-native.mixins.json',
                        'com/ae2vm/addon/nativeengine/NativeVm.class',
                        'com/ae2vm/addon/nativeengine/NativeVmProfiler.class',
                        'com/ae2vm/addon/nativeengine/NativeVmBenchmark.class',
                        'com/ae2vm/addon/nativeengine/NativeVmPlanningContext.class',
                        'com/ae2vm/addon/nativeengine/NativePatternCoefficients.class',
                        'com/ae2vm/addon/nativeengine/NativeVmCalculation.class',
                        'com/ae2vm/addon/vm/CraftingVM.class',
                        'com/ae2vm/addon/compiler/PatternCompiler.class',
                        'com/ae2vm/addon/nativeengine/mixin/NativeCraftingServiceMixin.class'])
                        || names.any { it.startsWith('com/syaru/ae2craftingoptimizer/')
                            || it.contains('/NativeVmCapture') || it.contains('/NativeVmPatternCatalog')
                            || it.contains('/NativePatternCatalog')
                            || it.contains('/NativeOrderSnapshot') || it.contains('/NativeGraphCalculation')
                            || it.contains('/NativePlanSelections') || it.contains('/RealtimeNetworkCraftingSimulationState') })
                    throw new GradleException('Native VM content/license boundary violated')
            }
        }
        logger.lifecycle("Verified exact VM ${exactVmVersion} and native VM ${nativeVmVersion}: nested bytes, bootstrap, classes, licenses")
    }
}
