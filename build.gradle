plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.143'
}

group = mod_group
version = mod_version

base {
    archivesName = "aco${mod_version}_${minecraft_version}"
}

tasks.named('jar') {
    // Keep the public filename identical across local and release builds.
    archiveFileName = "aco${mod_version}_${minecraft_version}.jar"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

repositories {
    mavenCentral()
}

neoForge {
    version = neo_version

    parchment {
        minecraftVersion = parchment_minecraft_version
        mappingsVersion = parchment_mappings_version
    }

    runs {
        client {
            client()
            gameDirectory = file('run')
        }
        server {
            server()
            gameDirectory = file('run-server')
            programArgument '--nogui'
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        ae2_crafting_optimizer {
            sourceSet(sourceSets.main)
        }
    }

    addModdingDependenciesTo sourceSets.test
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    def localModsDir = file(findProperty('acoLocalModsDir') ?: '../../mods')
    def requiredMod = { String fileName ->
        File dependency = new File(localModsDir, fileName)
        if (!dependency.isFile()) {
            throw new GradleException("Required 1.21.1 dependency is missing: ${dependency}")
        }
        dependency
    }

    implementation files(requiredMod('appliedenergistics2-19.2.17.jar'))
    implementation files(requiredMod('guideme-21.1.17.jar'))
    def advancedAeJar = requiredMod('AdvancedAE-1.6.11-1.21.1.jar')
    compileOnly files(advancedAeJar)
    // Mixin契約テストでも、実際に導入するAdvancedAEの記述子を直接検証する。
    testImplementation files(advancedAeJar)
    compileOnly files(requiredMod('neoecoae-21.1.1.jar'))
    compileOnly files(requiredMod('ldlib2-neoforge-1.21.1-2.2.32-all.jar'))

    // インスタンスへ任意連携先が入っている場合は、その実体を優先してコンパイルする。
    fileTree(localModsDir).matching {
        include 'gtceu-*.jar'
        include 'Mekanism-*.jar'
        include 'Applied-Mekanistics-*.jar'
        include 'appliede-*.jar'
    }.files.each { compileOnly files(it) }

    // 空の移植用インスタンスでも、公式JARを実行環境へ導入せず任意連携を検証する。
    def portCompileDeps = file('../../port-upstream/compile-deps')
    fileTree(portCompileDeps).matching {
        include 'gtceu-*.jar'
        include 'Mekanism-*.jar'
        include 'Applied-Mekanistics-*.jar'
    }.files.each { compileOnly files(it) }

    // Optional native integrations live outside the common source tree. They
    // are compiled into this artifact only when the corresponding 1.21.1 API
    // JAR is supplied, without hiding platform code with source exclusions.
    def hasGtceu = !fileTree(localModsDir).matching { include 'gtceu-*.jar' }.isEmpty()
            || !fileTree(portCompileDeps).matching { include 'gtceu-*.jar' }.isEmpty()
    def hasMekanism = !fileTree(localModsDir).matching { include 'Mekanism-*.jar' }.isEmpty()
            || !fileTree(portCompileDeps).matching { include 'Mekanism-*.jar' }.isEmpty()
    if (hasGtceu) {
        sourceSets.main.java.srcDir('src/optional/java/com/syaru/ae2craftingoptimizer/gtceu')
    }
    if (hasMekanism) {
        sourceSets.main.java.srcDir('src/optional/java/com/syaru/ae2craftingoptimizer/mekanism')
    }

    annotationProcessor 'org.spongepowered:mixin:0.8.7:processor'

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

tasks.register('updateGoldenFixtures', Test) {
    description = 'Explicitly regenerate canonical crafting Golden fixtures; normal test never overwrites them.'
    group = 'verification'
    dependsOn tasks.named('testClasses')
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    filter {
        includeTestsMatching '*CanonicalFixtureGoldenTest'
    }
    systemProperty 'aco.updateGolden', 'true'
}

tasks.register('verifyIssueRegressionManifest') {
    description = 'Validate the machine-readable mapping from historical Issues to regression evidence.'
    group = 'verification'
    dependsOn tasks.named('test')
}

tasks.register('verifyIssueRegressionReleaseReadiness') {
    description = 'Validate the automated regression scope for the current patch release.'
    group = 'verification'
    dependsOn tasks.named('verifyIssueRegressionManifest')

    def manifestFile = layout.projectDirectory.file('docs/issues/REGRESSION_MATRIX.tsv')
    def releaseScopeFile = layout.projectDirectory.file("docs/issues/RELEASE_SCOPE_${project.version}.tsv")
    inputs.file(manifestFile)
    inputs.file(releaseScopeFile)

    doLast {
        List<String> manifestLines = manifestFile.asFile.readLines('UTF-8').findAll { line ->
            !line.isBlank() && !line.startsWith('#')
        }
        Map<String, String[]> manifestByIssue = [:]

        // リリース対象Issueを正本の回帰台帳へ結び付けるため、Issue番号で索引化します。
        for (String line : manifestLines.drop(1)) {
            String[] columns = line.split('\t', -1)
            if (columns.length != 8) {
                throw new GradleException("Malformed regression matrix row: ${line}")
            }
            manifestByIssue[columns[0]] = columns
        }

        List<String> scopeLines = releaseScopeFile.asFile.readLines('UTF-8')
        String expectedVersion = "# release=${project.version}"
        String baselineLine = scopeLines.find { line -> line.startsWith('# baseline=') }
        if (!scopeLines.contains(expectedVersion)) {
            throw new GradleException("Release scope does not match project version ${project.version}")
        }
        if (baselineLine == null || baselineLine.substring('# baseline='.length()).isBlank()) {
            throw new GradleException('Release scope must declare a non-empty baseline version')
        }

        List<String> scopeData = scopeLines.findAll { line -> !line.isBlank() && !line.startsWith('#') }
        if (scopeData.isEmpty() || scopeData.first() != 'issue\tchange\tautomated_guarantee') {
            throw new GradleException('Release scope header is missing or malformed')
        }

        List<String> pendingRuntime = []
        Set<String> scopedIssues = [] as Set

        // 今回の差分へ関係するIssueだけを検証し、過去全件監査とは責務を分離します。
        for (String line : scopeData.drop(1)) {
            String[] columns = line.split('\t', -1)
            if (columns.length != 3) {
                throw new GradleException("Malformed release scope row: ${line}")
            }
            if (!scopedIssues.add(columns[0])) {
                throw new GradleException("Duplicate release scope Issue: #${columns[0]}")
            }
            String[] manifest = manifestByIssue[columns[0]]
            if (manifest == null) {
                throw new GradleException("Release scope references unknown Issue: #${columns[0]}")
            }
            if (columns[1].isBlank() || columns[2].isBlank()) {
                throw new GradleException("Release scope explanation is empty: #${columns[0]}")
            }
            if (manifest[5] == 'PENDING') {
                pendingRuntime.add("#${columns[0]} [${manifest[3]}] ${manifest[7]}")
            }
        }

        if (scopedIssues.isEmpty()) {
            throw new GradleException('Release scope must contain at least one Issue')
        }

        // 未実施の実機確認は成功へ変換せず、公開時に明示する警告として残します。
        if (!pendingRuntime.isEmpty()) {
            logger.warn('Patch release automated gate passed, but runtime verification remains pending:\n- '
                    + pendingRuntime.join('\n- '))
        }
    }
}

tasks.register('verifyAllIssueRuntimeReadiness') {
    description = 'Require every historical GameTest and runtime regression check to be verified.'
    group = 'verification'
    dependsOn tasks.named('verifyIssueRegressionManifest')

    def manifestFile = layout.projectDirectory.file('docs/issues/REGRESSION_MATRIX.tsv')
    inputs.file(manifestFile)

    doLast {
        List<String> dataLines = manifestFile.asFile.readLines('UTF-8').findAll { line ->
            !line.isBlank() && !line.startsWith('#')
        }
        List<String> blockers = []

        // 全履歴保証では、未実施のGameTestと実機試験を一件も許可しません。
        for (String line : dataLines.drop(1)) {
            String[] columns = line.split('\t', -1)
            if (columns.length != 8) {
                throw new GradleException("Malformed regression matrix row: ${line}")
            }
            if (columns[5] != 'PENDING') {
                continue
            }
            blockers.add("#${columns[0]} [${columns[3]}] ${columns[7]}")
        }

        // 全履歴を確認済みと名乗る場合だけ、残る未確認項目を厳格に拒否します。
        if (!blockers.isEmpty()) {
            throw new GradleException(
                    'Full historical runtime gate is blocked by pending verification:\n- '
                            + blockers.join('\n- '))
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyIssueRegressionManifest')
}

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') {
        expand 'file': ['jarVersion': project.version]
    }
}

jar {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : 'syaru',
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.version,
                'Implementation-Vendor'   : 'syaru',
                'MixinConfigs'             : 'ae2_crafting_optimizer.mixins.json'
        ])
    }
}
