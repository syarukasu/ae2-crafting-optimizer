plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.143'
}

group = mod_group
version = mod_version

base {
    archivesName = "aco${mod_version}_${minecraft_version}"
}

tasks.named('jar') {
    // Keep the public filename identical across local and release builds.
    archiveFileName = "aco${mod_version}_${minecraft_version}.jar"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

repositories {
    mavenCentral()
}

neoForge {
    version = neo_version

    parchment {
        minecraftVersion = parchment_minecraft_version
        mappingsVersion = parchment_mappings_version
    }

    runs {
        client {
            client()
            gameDirectory = file('run')
        }
        server {
            server()
            gameDirectory = file('run-server')
            programArgument '--nogui'
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        ae2_crafting_optimizer {
            sourceSet(sourceSets.main)
        }
    }

    addModdingDependenciesTo sourceSets.test
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    def localModsDir = file(findProperty('acoLocalModsDir') ?: '../../mods')
    def requiredMod = { String fileName ->
        File dependency = new File(localModsDir, fileName)
        if (!dependency.isFile()) {
            throw new GradleException("Required 1.21.1 dependency is missing: ${dependency}")
        }
        dependency
    }

    implementation files(requiredMod('appliedenergistics2-19.2.17.jar'))
    implementation files(requiredMod('guideme-21.1.17.jar'))
    def advancedAeJar = requiredMod('AdvancedAE-1.6.11-1.21.1.jar')
    compileOnly files(advancedAeJar)
    // Mixin契約テストでも、実際に導入するAdvancedAEの記述子を直接検証する。
    testImplementation files(advancedAeJar)
    compileOnly files(requiredMod('neoecoae-21.1.1.jar'))
    compileOnly files(requiredMod('ldlib2-neoforge-1.21.1-2.2.32-all.jar'))

    // インスタンスへ任意連携先が入っている場合は、その実体を優先してコンパイルする。
    fileTree(localModsDir).matching {
        include 'gtceu-*.jar'
        include 'Mekanism-*.jar'
        include 'Applied-Mekanistics-*.jar'
        include 'appliede-*.jar'
    }.files.each { compileOnly files(it) }

    // 空の移植用インスタンスでも、公式JARを実行環境へ導入せず任意連携を検証する。
    def portCompileDeps = file('../../port-upstream/compile-deps')
    fileTree(portCompileDeps).matching {
        include 'gtceu-*.jar'
        include 'Mekanism-*.jar'
        include 'Applied-Mekanistics-*.jar'
    }.files.each { compileOnly files(it) }

    // Optional native integrations live outside the common source tree. They
    // are compiled into this artifact only when the corresponding 1.21.1 API
    // JAR is supplied, without hiding platform code with source exclusions.
    def hasGtceu = !fileTree(localModsDir).matching { include 'gtceu-*.jar' }.isEmpty()
            || !fileTree(portCompileDeps).matching { include 'gtceu-*.jar' }.isEmpty()
    def hasMekanism = !fileTree(localModsDir).matching { include 'Mekanism-*.jar' }.isEmpty()
            || !fileTree(portCompileDeps).matching { include 'Mekanism-*.jar' }.isEmpty()
    if (hasGtceu) {
        sourceSets.main.java.srcDir('src/optional/java/com/syaru/ae2craftingoptimizer/gtceu')
    }
    if (hasMekanism) {
        sourceSets.main.java.srcDir('src/optional/java/com/syaru/ae2craftingoptimizer/mekanism')
    }

    annotationProcessor 'org.spongepowered:mixin:0.8.7:processor'

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

tasks.register('updateGoldenFixtures', Test) {
    description = 'Explicitly regenerate canonical crafting Golden fixtures; normal test never overwrites them.'
    group = 'verification'
    dependsOn tasks.named('testClasses')
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    filter {
        includeTestsMatching '*CanonicalFixtureGoldenTest'
    }
    systemProperty 'aco.updateGolden', 'true'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') {
        expand 'file': ['jarVersion': project.version]
    }
}

jar {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : 'syaru',
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.version,
                'Implementation-Vendor'   : 'syaru',
                'MixinConfigs'             : 'ae2_crafting_optimizer.mixins.json'
        ])
    }
}
