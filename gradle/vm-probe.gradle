// Issue #208: actual upstream compiler/VM, isolated from every distribution artifact.
def vmSource = providers.gradleProperty('ae2VmSource')
def patchExactStack = providers.gradleProperty('vmPatchExactStack').getOrElse('true').toBoolean()
def vmHashes = [
    'compiler/IFiniteUseInput.java': '4f5db4cdf8861b08f72451145e2ba06b5849cf6c6b70327d67d6de0248b83491',
    'vm/CraftingVM.java': 'fc956d2da1e2bbe634d4ca7f71421f6ef874ce8a8f6ab62a56b9d2f15e4fbcd7',
    'vm/CraftingBytecode.java': '9239b4c87995e5a26ad291e61b0f982031064b5859145845fb0ec793ea1dc6d4',
    'vm/Opcode.java': 'eb6da61817d7d4baa29623eb262e37f83ddb943898439a74717d87bd1fe4dc47',
    'compiler/PatternCompiler.java': 'da163c7b967355adc8a542296f23d7a0aff6d7eb49efe26ef6f96e600fbf8968',
    'mixin/CraftingSimulationStateAccessor.java': 'f1d3421fe44a977144b0c155f3c24d9b3682afa8dcbc645b625fce981da52b37'
]
def generated = layout.buildDirectory.dir('vm-probe-upstream')

tasks.register('prepareVmProbeSources') {
    // Always verify inputs; a mutable checkout must not silently replace the engine.
    outputs.upToDateWhen { false }
    doLast {
        if (!vmSource.isPresent()) throw new GradleException('Supply -Pae2VmSource=<pinned AE2-VM checkout>')
        def root = file(vmSource.get())
        vmHashes.each { path, expected ->
            def source = new File(root, "src/main/java/com/ae2vm/addon/${path}")
            if (!source.isFile()) throw new GradleException("Missing VM source: ${path}")
            def bytes = source.getText('UTF-8').replace('\r\n', '\n').getBytes('UTF-8')
            def hash = java.security.MessageDigest.getInstance('SHA-256').digest(bytes).encodeHex().toString()
            if (hash != expected) throw new GradleException("Pinned VM source mismatch: ${path}")
        }
        if (!new File(root, 'LICENSE').isFile()) throw new GradleException('VM LICENSE missing')
        copy {
            from new File(root, 'src/main/java')
            into generated
            vmHashes.keySet().each { include "com/ae2vm/addon/${it}" }
        }
        copy {
            from new File(root, 'LICENSE')
            into layout.buildDirectory.dir('vm-probe-provenance')
        }
        if (patchExactStack) {
            exec {
                commandLine 'git', 'apply', '--ignore-space-change',
                        '--directory=build/vm-probe-upstream',
                        file('tools/ae2-vm/patches/0001-exact-stack-arithmetic.patch').absolutePath
            }
        }
    }
}

sourceSets {
    vmProbe {
        java.srcDir generated
        compileClasspath += sourceSets.test.output + sourceSets.test.compileClasspath
        runtimeClasspath += sourceSets.test.output + sourceSets.test.runtimeClasspath
    }
}
tasks.named('compileVmProbeJava') {
    dependsOn 'prepareVmProbeSources', 'testClasses'
}
tasks.register('vmProbeTest', Test) {
    group = 'verification'
    description = 'Run pinned real AE2-VM compatibility probes; not a production integration.'
    testClassesDirs = sourceSets.vmProbe.output.classesDirs
    classpath = sourceSets.vmProbe.runtimeClasspath
    useJUnitPlatform()
    // Strict assertions fail on the unpatched baseline and must pass with the local patch.
    systemProperty 'aco.vm.requireExact', providers.gradleProperty('vmRequireExact').getOrElse(patchExactStack.toString())
}
