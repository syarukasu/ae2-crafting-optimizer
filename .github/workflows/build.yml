name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Download pinned 1.21.1 mod dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-mods
          curl -fL -o .ci-mods/appliedenergistics2-19.2.17.jar https://edge.forgecdn.net/files/7027/323/appliedenergistics2-19.2.17.jar
          curl -fL -o .ci-mods/guideme-21.1.17.jar https://edge.forgecdn.net/files/8420/861/guideme-21.1.17.jar
          curl -fL -o .ci-mods/AdvancedAE-1.6.11-1.21.1.jar https://edge.forgecdn.net/files/7849/217/AdvancedAE-1.6.11-1.21.1.jar
          curl -fL -o .ci-mods/neoecoae-21.1.1.jar https://edge.forgecdn.net/files/8463/264/neoecoae-21.1.1.jar
          curl -fL -o .ci-mods/ldlib2-neoforge-1.21.1-2.2.32-all.jar https://edge.forgecdn.net/files/8554/985/ldlib2-neoforge-1.21.1-2.2.32-all.jar

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew clean build --stacktrace -PacoLocalModsDir="$GITHUB_WORKSPACE/.ci-mods"

      - name: Verify 1.21.1 artifact boundary
        shell: bash
        run: |
          set -euo pipefail
          version="$(grep '^mod_version=' gradle.properties | cut -d= -f2)"
          artifact="build/libs/aco${version}_1.21.1.jar"
          test -f "$artifact"
          ! jar tf "$artifact" | grep -q '^META-INF/mods.toml$'
          jar tf "$artifact" | grep -q '^META-INF/neoforge.mods.toml$'
          ! jar tf "$artifact" | grep -q 'net/minecraftforge/'
          ! jar tf "$artifact" | grep -q 'aco.*1.20.1'
          python3 - "$artifact" <<'PY'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as jar:
              classes = [n for n in jar.namelist() if n.endswith('.class')]
              assert classes, 'artifact contains no class files'
              versions = {int.from_bytes(jar.read(n)[6:8], 'big') for n in classes}
              assert versions == {65}, f'unexpected class versions: {versions}'
          PY

      - name: Upload jar
        uses: actions/upload-artifact@v6
        with:
          name: aco-1.21.1-${{ github.sha }}
          path: build/libs/aco*_1.21.1.jar
          if-no-files-found: error
