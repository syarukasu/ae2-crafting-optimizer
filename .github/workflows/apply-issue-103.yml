name: Apply issue 103 patch

on:
  push:
    branches:
      - fix/issue-103-root-program-generation-1.21.1

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out patch branch
        uses: actions/checkout@v6
        with:
          ref: fix/issue-103-root-program-generation-1.21.1

      - name: Apply deterministic issue 103 patch
        run: python3 tools/apply_issue_103_patch.py

      - name: Validate and publish patch commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: stabilize compiled root program generations (#103)"
          git push origin HEAD:fix/issue-103-root-program-generation-1.21.1
